<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineList — Listagem</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>CineList</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="listagem.html" class="ativo">Listagem</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Meus Filmes</h2>

      <form id="form-filtro">
        <label for="filtro-genero">Filtrar por gênero</label>
        <select id="filtro-genero">
          <option value="">Todos</option>
          <option value="Ação">Ação</option>
          <option value="Comédia">Comédia</option>
          <option value="Drama">Drama</option>
          <option value="Ficção Científica">Ficção Científica</option>
          <option value="Terror">Terror</option>
          <option value="Animação">Animação</option>
          <option value="Documentário">Documentário</option>
          <option value="Outro">Outro</option>
        </select>
      </form>

      <p id="mensagem-vazia" hidden>Nenhum filme cadastrado ainda. <a href="cadastro.html">Cadastrar agora</a></p>

      <ul id="lista-filmes"></ul>

    </section>
  </main>

  <footer>
    <p>&copy; 2025 CineList — Projeto TECWEB</p>
  </footer>

  <script src="js/listagem.js"></script>
</body>
</html>
